# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# --- Clock ---
label {
    monitor =
    text = $TIME
    color = rgb(202, 211, 245)
    font_size = 64
    font_family = Iosevka
    position = 0, 120
    halign = center
    valign = center
}

# --- Password Input Field ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_fade_time = 200
    fade_on_empty = false
    font_color = rgb(202, 211, 245)
    inner_color = rgb(30, 30, 46)
    outer_color = rgb(138, 173, 244)
    check_color = rgb(245, 194, 231)
    fail_color = rgb(243, 139, 168)
    shadow_passes = 1
    position = 0, -20
    halign = center
    valign = center
}

# --- Action Buttons ---

# Shutdown
label {
    monitor =
    text = 󰐥  Power Off
    color = rgb(243, 139, 168)
    font_size = 14
    font_family = Iosevka
    position = -140, 50
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}

# Reboot
label {
    monitor =
    text = 󰜉  Reboot
    color = rgb(250, 179, 135)
    font_size = 14
    font_family = Iosevka
    position = 0, 50
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

# Log Out
label {
    monitor =
    text = 󰍃  Log Out
    color = rgb(249, 226, 175)
    font_size = 14
    font_family = Iosevka Nerd Font
    position = 140, 50
    halign = center
    valign = bottom
    onclick = hyprshutdown --vt 2
}
